# Compila todos los .mq4/.mq5 de mql/ (MetaEditor nativo en Windows) y los cBots de ctrader/ (gate dotnet).
#
# ⚠️ LECCIONES APRENDIDAS (investigación + 4 runs fallidos, 2026-08-09):
# - mt4/mt5setup.exe son BOOTSTRAPPERS de MetaQuotes (ignoran /S /L /D).
#   El flag correcto es /auto; la instalación es ASINCRÓNICA (hay que hacer
#   poll de metaeditor*.exe hasta ~2.5 min).
# - Start-Process -Wait sobre el setup puede colgarse (el bootstrapper lanza
#   terminal64.exe): hacer poll del editor, no esperar el proceso.
# - MT4 edita con metaeditor.exe (32-bit, suele ir a Program Files (x86));
#   MT5 usa metaeditor64.exe. Buscar en AMBOS directorios.
# - NO usar fx31337/mql-compile-action con mt-path env: los inputs `with:` no
#   expanden variables de entorno (error "Platform cannot be found in
#   $env:METAEDITOR"). Compilar directo con metaeditor /compile: es más simple
#   y evita la action.
# - El log de MetaEditor es UTF-16 (Get-Content -Encoding Unicode).
# - cTrader: paquete oficial NuGet cTrader.Automate (Spotware) → dotnet build
#   como gate de sintaxis (la compilación ALGO real solo ocurre en cTrader).
# - Pasos con timeout-minutes para nunca colgar el job 6 horas.
name: compile-mql

on:
  push:
    paths:
      - "mql/**"
      - "ctrader/**"
      - ".github/workflows/compile-mql.yml"
  pull_request:
    paths:
      - "mql/**"
      - "ctrader/**"
      - ".github/workflows/compile-mql.yml"
  workflow_dispatch:

jobs:
  compile-mql5:
    name: Compile MQL5
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache plataforma MT5
        uses: actions/cache@v4
        with:
          path: C:\Program Files\MetaTrader 5
          key: mt5-platform-v1

      - name: Instalar MT5 (/auto) y localizar metaeditor64.exe
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $setup -UseBasicParsing
          Write-Host 'Instalación silenciosa (/auto)...'
          Start-Process -FilePath $setup -ArgumentList '/auto' -Wait
          $me = $null
          foreach ($i in 1..40) {   # instalación asíncrona: poll hasta ~3.3 min
            $me = Get-ChildItem 'C:\Program Files','C:\Program Files (x86)' -Recurse -Filter 'metaeditor64.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($me) { break }
            Start-Sleep -Seconds 5
          }
          if (-not $me) { Write-Error 'metaeditor64.exe no encontrado tras instalar MT5'; exit 1 }
          "METAEDITOR64=$($me.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "MetaEditor: $($me.FullName)"

      - name: Compilar todos los .mq5
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $me = $env:METAEDITOR64
          $failed = $false
          Get-ChildItem 'mql' -Filter '*.mq5' | ForEach-Object {
            $src = $_.FullName
            $ex  = [System.IO.Path]::ChangeExtension($src, 'ex5')
            $log = "$src.log"
            if (Test-Path $ex)  { Remove-Item $ex  -Force }
            if (Test-Path $log) { Remove-Item $log -Force }
            Write-Host "::group::Compilando $($_.Name)"
            Start-Process -FilePath $me -ArgumentList "/compile:`"$src`"", "/log:`"$log`"" -Wait
            if (Test-Path $log) {
              Get-Content -Path $log -Encoding Unicode | ForEach-Object { Write-Host $_ }
            }
            Write-Host "::endgroup::"
            if (-not (Test-Path $ex)) {
              Write-Error "FALLO de compilación: $($_.Name)"
              $failed = $true
            } else {
              Write-Host "OK: $ex ($((Get-Item $ex).Length) bytes)"
            }
          }
          if ($failed) { exit 1 }

      - name: Subir binarios (.ex5)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mql-mq5-binaries
          path: "mql/**/*.ex5"
          if-no-files-found: ignore
          retention-days: 14

  compile-mql4:
    name: Compile MQL4
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache plataforma MT4
        uses: actions/cache@v4
        with:
          path: C:\Program Files\MetaTrader 4
          key: mt4-platform-v1

      - name: Instalar MT4 (/auto) y localizar metaeditor.exe
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'mt4setup.exe'
          foreach ($attempt in 1..3) {
            try {
              Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt4/mt4setup.exe' -OutFile $setup -UseBasicParsing
              break
            } catch {
              Write-Host "Descarga intento $attempt fallo: $_"
              if ($attempt -eq 3) { throw }
              Start-Sleep -Seconds 10
            }
          }
          Write-Host "Instalador: $((Get-Item $setup).Length) bytes"
          Write-Host 'Instalacion silenciosa (/auto)...'
          Start-Process -FilePath $setup -ArgumentList '/auto' -Wait
          Get-Process -Name 'terminal','terminal64' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $me = $null
          foreach ($i in 1..90) {
            $me = Get-ChildItem 'C:\Program Files','C:\Program Files (x86)' -Recurse -Filter 'metaeditor.exe' -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -notmatch 'MetaTrader 5' } | Select-Object -First 1
            if ($me) { break }
            Start-Sleep -Seconds 5
          }
          if (-not $me) { Write-Error 'metaeditor.exe (MT4) no encontrado tras instalar MT4'; exit 1 }
          "METAEDITOR4=$($me.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "MetaEditor MT4: $($me.FullName)"

      - name: Compilar todos los .mq4
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $me = $env:METAEDITOR4
          $failed = $false
          Get-ChildItem 'mql' -Filter '*.mq4' | ForEach-Object {
            $src = $_.FullName
            $ex  = [System.IO.Path]::ChangeExtension($src, 'ex4')
            $log = "$src.log"
            if (Test-Path $ex)  { Remove-Item $ex  -Force }
            if (Test-Path $log) { Remove-Item $log -Force }
            Write-Host "::group::Compilando $($_.Name)"
            Start-Process -FilePath $me -ArgumentList "/compile:`"$src`"", "/log:`"$log`"" -Wait
            if (Test-Path $log) {
              Get-Content -Path $log -Encoding Unicode | ForEach-Object { Write-Host $_ }
            }
            Write-Host "::endgroup::"
            if (-not (Test-Path $ex)) {
              Write-Error "FALLO de compilación: $($_.Name)"
              $failed = $true
            } else {
              Write-Host "OK: $ex ($((Get-Item $ex).Length) bytes)"
            }
          }
          if ($failed) { exit 1 }

      - name: Subir binarios (.ex4)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mql-mq4-binaries
          path: "mql/**/*.ex4"
          if-no-files-found: ignore
          retention-days: 14

  compile-ctrader:
    name: Compile cTrader (dotnet syntax gate, best-effort)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Gate NO-BLOQUEANTE: valida sintaxis C# contra stubs de la API; la compilación
    # ALGO real solo ocurre dentro de cTrader Automate (SDK propietario). Los
    # cBots se verifican manualmente en cTrader antes de publicar.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Gate de sintaxis C# con stubs de la API
        shell: bash
        timeout-minutes: 8
        run: |
          set -e
          mkdir -p /tmp/ctbuilder && cd /tmp/ctbuilder
          dotnet new classlib -n cTraderBuild -o . --force >/dev/null
          rm -f Class1.cs
          # Stubs.cs (ctrader/) define la superficie mínima de la API de cTrader:
          # la compilación ALGO real solo ocurre dentro de cTrader Automate
          # (SDK propietario no disponible en CI). Este job valida sintaxis y
          # tipos de nuestros cBots contra esa superficie.
          cp "$GITHUB_WORKSPACE/ctrader/"*.cs .
          if dotnet build --nologo -v q 2>/tmp/ctbuild.log; then
            echo "cTrader: sintaxis OK (gate estático con stubs)"
          else
            echo "cTrader: errores detectados (ver log abajo)"
            grep -E "error CS" /tmp/ctbuild.log | head -20 || tail -30 /tmp/ctbuild.log
            exit 1
          fi
