# Compila todos los .mq4 y .mq5 de mql/ usando MetaEditor en un runner de Windows.
#
# ⚠️ POR QUÉ ESTE DISEÑO:
# - MetaEditor (metaeditor64.exe) es nativo de Windows -> compilar en windows-latest.
# - La action fx31337/mql-compile-action v2 NO instala la plataforma: exige un
#   `mt-path` con una instalación de MetaTrader. El patrón estándar del ecosistema
#   EA31337 es: (1) job que descarga la plataforma MT4/MT5 y la sube como artifact
#   (reusable workflow EA31337/EA-Tester platform-linux.yml), (2) job en Windows
#   que la descarga y la pasa como mt-path.
#
# Flujo:
#   platform (ubuntu, reusable workflow)  ->  artifact .mt4 / .mt5
#        └──────────────►  compile (windows)  ->  .ex4 / .ex5 artifacts + logs
name: compile-mql

on:
  push:
    paths:
      - "mql/**"
      - ".github/workflows/compile-mql.yml"
  pull_request:
    paths:
      - "mql/**"
      - ".github/workflows/compile-mql.yml"
  workflow_dispatch:

jobs:
  platform-mt4:
    name: Instalar plataforma MT4 (Linux)
    uses: EA31337/EA-Tester/.github/workflows/platform-linux.yml@dev
    with:
      artifact_name: mt4
      artifact_overwrite: true
      skip_cleanup: true
      version: 4

  platform-mt5:
    name: Instalar plataforma MT5 (Linux)
    uses: EA31337/EA-Tester/.github/workflows/platform-linux.yml@dev
    with:
      artifact_name: mt5
      artifact_overwrite: true
      skip_cleanup: true
      version: 5

  compile-mq4:
    name: Compile MQL4
    needs: platform-mt4
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar plataforma MT4
        uses: actions/download-artifact@v4
        with:
          name: mt4
          path: .mt4

      - name: Compilar MQL4 con MetaEditor
        uses: fx31337/mql-compile-action@v2
        with:
          path: "mql"
          path-ignore: "**/*.mq5"
          init-platform: "true"
          mt-path: ".mt4"
          log-file: "compile-mq4.log"

      - name: Subir binarios compilados (ex4)
        uses: actions/upload-artifact@v4
        with:
          name: mql-mq4-binaries
          path: "mql/**/*.ex4"
          if-no-files-found: error
          retention-days: 14

      - name: Subir log de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mql-mq4-log
          path: "compile-mq4.log"
          if-no-files-found: ignore
          retention-days: 14

  compile-mq5:
    name: Compile MQL5
    needs: platform-mt5
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar plataforma MT5
        uses: actions/download-artifact@v4
        with:
          name: mt5
          path: .mt5

      - name: Compilar MQL5 con MetaEditor
        uses: fx31337/mql-compile-action@v2
        with:
          path: "mql"
          path-ignore: "**/*.mq4"
          init-platform: "true"
          mt-path: ".mt5"
          log-file: "compile-mq5.log"

      - name: Subir binarios compilados (ex5)
        uses: actions/upload-artifact@v4
        with:
          name: mql-mq5-binaries
          path: "mql/**/*.ex5"
          if-no-files-found: error
          retention-days: 14

      - name: Subir log de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mql-mq5-log
          path: "compile-mq5.log"
          if-no-files-found: ignore
          retention-days: 14
