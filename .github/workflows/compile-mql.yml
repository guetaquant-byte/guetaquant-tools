# Compila todos los .mq4 y .mq5 de mql/ usando MetaEditor en un runner de Windows.
#
# ⚠️ POR QUÉ ESTE DISEÑO:
# - MetaEditor (metaeditor64.exe) es nativo de Windows -> compilar en windows-latest.
# - La action fx31337/mql-compile-action v2 NO instala la plataforma: exige un
#   `mt-path` con una instalación de MetaTrader. El patrón estándar del ecosistema
#   EA31337 (EA-Tester platform-linux.yml) está ROTO a día de hoy (pina
#   ea31337.wine@v1.0.4 que ya no existe en Ansible Galaxy) — por eso este
#   workflow instala la plataforma directamente en Windows:
#     1. Descarga el instalador oficial de MetaTrader (MetaQuotes).
#     2. Instala en modo silencioso (/S) en el runner.
#     3. Compila con fx31337/mql-compile-action@v2 usando el directorio instalado
#        como mt-path.
name: compile-mql

on:
  push:
    paths:
      - "mql/**"
      - ".github/workflows/compile-mql.yml"
  pull_request:
    paths:
      - "mql/**"
      - ".github/workflows/compile-mql.yml"
  workflow_dispatch:

env:
  MT4_PATH: "C:\\Program Files\\MetaTrader 4"
  MT5_PATH: "C:\\Program Files\\MetaTrader 5"

jobs:
  compile:
    name: Compile MQL${{ matrix.version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "4"
            url: "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt4/mt4setup.exe"
            install_dir: "C:\\Program Files\\MetaTrader 4"
            ignore: "**/*.mq5"
            artifact: "*.ex4"
          - version: "5"
            url: "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
            install_dir: "C:\\Program Files\\MetaTrader 5"
            ignore: "**/*.mq4"
            artifact: "*.ex5"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar instalador MetaTrader ${{ matrix.version }}
        shell: pwsh
        run: |
          $url = "${{ matrix.url }}"
          $out = "$env:RUNNER_TEMP\mt${{ matrix.version }}setup.exe"
          Write-Host "Descargando $url"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          Write-Host "Instalador descargado: $((Get-Item $out).Length) bytes"

      - name: Instalar MetaTrader ${{ matrix.version }} (silencioso)
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\mt${{ matrix.version }}setup.exe"
          # /S = instalación silenciosa, /L=idioma (ES), /D=directorio destino
          $proc = Start-Process -FilePath $setup -ArgumentList "/S", "/L=es", "/D=${{ matrix.install_dir }}" -PassThru -Wait
          Write-Host "Instalador exit code: $($proc.ExitCode)"
          Get-ChildItem "${{ matrix.install_dir }}" -Recurse -Filter "metaeditor*.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "MetaEditor encontrado: $($_.FullName)" }

      - name: Compilar MQL${{ matrix.version }} con MetaEditor
        uses: fx31337/mql-compile-action@v2
        with:
          path: "mql"
          path-ignore: ${{ matrix.ignore }}
          init-platform: "true"
          mt-path: "${{ matrix.install_dir }}"
          log-file: "compile-mq${{ matrix.version }}.log"

      - name: Subir binarios compilados
        uses: actions/upload-artifact@v4
        with:
          name: mql-mq${{ matrix.version }}-binaries
          path: "mql/**/${{ matrix.artifact }}"
          if-no-files-found: error
          retention-days: 14

      - name: Subir log de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mql-mq${{ matrix.version }}-log
          path: "compile-mq${{ matrix.version }}.log"
          if-no-files-found: ignore
          retention-days: 14
